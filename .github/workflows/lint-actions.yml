name: run common linters for GitHub Action

on:
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  lint:
    uses: cloudnativedaysjp/reusable-workflows/.github/workflows/wc-lint-actions.yml@4129ce525f77d630ba63e86ed58c1d83bb37f7c3
    permissions:
      contents: write
      pull-requests: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
