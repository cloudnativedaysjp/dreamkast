name: Push a new tag when Pull Requests are merged

on:
  pull_request:
    types: [closed]

jobs:
  tagging:
    if: ${{ contains(github.event.pull_request.title, '[dreamkast-releasebot]') }}
    uses: cloudnativedaysjp/reusable-workflows/.github/workflows/wc-push-new-tag.yml@4129ce525f77d630ba63e86ed58c1d83bb37f7c3
    permissions:
      pull-requests: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
