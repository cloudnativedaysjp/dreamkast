name: cleanup reviewapps

on:
  schedule:
    - cron:  '*/30 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    uses: cloudnativedaysjp/reusable-workflows/.github/workflows/wc-cleanup-ecs-reviewapps.yml@4129ce525f77d630ba63e86ed58c1d83bb37f7c3
    permissions:
      id-token: write
    with:
      prefix: dk-
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
