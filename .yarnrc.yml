# webpack / sass / jest が node_modules を直接参照するため PnP は使わない
nodeLinker: node-modules

# 依存パッケージの install / preinstall / postinstall スクリプトを実行しない。
# yarn 4 のデフォルトも false だが、将来デフォルトが変わっても影響を受けないよう明示する。
# ビルドスクリプトが必要なパッケージが出てきた場合は、package.json の
# dependenciesMeta.<package>.built で個別に許可する。
enableScripts: false

# 公開から一定時間経っていないバージョンはインストールしない（分単位）。
# npm レジストリへの供給網攻撃で、乗っ取られた直後のバージョンを掴まないようにするため。
# 1440 = 24時間。
npmMinimalAgeGate: 1440
